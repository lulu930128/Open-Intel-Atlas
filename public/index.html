<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Intel Atlas</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-stage" aria-label="Fullscreen signal map">
        <div class="world-map" id="world-map" aria-label="Signal map"></div>

        <a class="scroll-cue" href="#news-panel">Scroll for records</a>
      </section>

      <section class="content-shell" id="news-panel">
        <section class="hero">
          <div>
            <p class="eyebrow">Open Intel Atlas</p>
            <h1>AI-ready global monitoring brief</h1>
            <p class="lede" id="brief-summary">Loading latest public intelligence signals...</p>
          </div>
          <div class="status-panel">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Collecting sources</span>
          </div>
        </section>

        <section class="filter-bar" aria-label="News filters">
          <div>
            <p class="eyebrow">Time window</p>
            <div class="time-buttons" role="group" aria-label="Select time window">
              <button class="time-button active" type="button" data-range="live">Realtime</button>
              <button class="time-button" type="button" data-range="24h">24H</button>
              <button class="time-button" type="button" data-range="7d">7D</button>
              <button class="time-button" type="button" data-range="30d">30D</button>
              <button class="time-button" type="button" data-range="all">All</button>
            </div>
          </div>
          <label class="date-filter">
            <span>Specific date</span>
            <input id="date-filter" type="date" />
          </label>
          <label class="category-field">
            <span>Category</span>
            <select id="category-filter" aria-label="Filter category">
              <option value="all">All categories</option>
              <option value="geopolitics">Geopolitics</option>
              <option value="infrastructure">Infrastructure</option>
              <option value="finance">Finance</option>
              <option value="ai">AI Updates</option>
            </select>
          </label>
        </section>

        <section class="metrics-grid" id="metrics-grid" aria-label="Category metrics"></section>

        <section class="source-panel" aria-label="Source registry">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Sources</p>
              <h2>Registry and health</h2>
            </div>
            <code>/api/sources</code>
          </div>
          <div id="source-list" class="source-list"></div>
        </section>

        <section class="news-layout">
          <div class="brief-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Dispatch</p>
                <h2>AI handoff feed</h2>
              </div>
              <button id="refresh-button" type="button">Refresh</button>
            </div>
            <div class="watchlist" id="watchlist"></div>
          </div>

          <section class="event-feed">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Events</p>
                <h2>Normalized source records</h2>
              </div>
              <code>/api/dispatch</code>
            </div>
            <div id="event-list" class="event-list"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
