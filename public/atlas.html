<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Intel Atlas · Full Map</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="atlas">
    <main class="atlas-shell">
      <header class="topbar atlas-topbar" aria-label="Map header">
        <a class="brand" href="/" aria-label="Back to dashboard">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <strong>Open Intel Atlas</strong>
            <small>Full global signal map</small>
          </span>
        </a>

        <section class="filters compact" aria-label="Map filters">
          <div class="time-buttons" role="group" aria-label="Select time window">
            <button class="time-button active" type="button" data-range="live">Live</button>
            <button class="time-button" type="button" data-range="24h">24H</button>
            <button class="time-button" type="button" data-range="7d">7D</button>
            <button class="time-button" type="button" data-range="30d">30D</button>
            <button class="time-button" type="button" data-range="all">All</button>
          </div>
          <label>
            <span>Category</span>
            <select id="category-filter">
              <option value="all">All categories</option>
              <option value="geopolitics">International</option>
              <option value="infrastructure">Infrastructure</option>
              <option value="finance">Finance</option>
              <option value="ai">Technology</option>
            </select>
          </label>
          <button id="refresh-button" type="button">Refresh</button>
        </section>
      </header>

      <section class="atlas-layout">
        <div class="world-map full" id="full-map" aria-label="Full signal map"></div>
        <aside class="map-drawer" aria-label="Map signal list">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Map records</p>
              <h1>Observed signals</h1>
            </div>
            <span id="status-text">Collecting sources</span>
          </div>
          <div class="map-records" id="map-records"></div>
        </aside>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
